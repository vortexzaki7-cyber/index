<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <title>VORTEX 7wakom a w9</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh; display: grid; place-items: center; overflow: hidden;
      background: #070707; color: #fff; font-family: Arial, Helvetica, sans-serif;
    }
    body::before {
      content: ""; position: fixed; inset: -30%;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(255, 0, 35, .20), transparent 34%),
        radial-gradient(ellipse at 80% 40%, rgba(130, 0, 20, .18), transparent 32%);
      animation: ambience 8s ease-in-out infinite alternate;
    }
    .scanlines {
      position: fixed; inset: 0; pointer-events: none; opacity: .12; z-index: 5;
      background: repeating-linear-gradient(to bottom, transparent 0 3px, #fff 4px, transparent 5px);
      mix-blend-mode: overlay;
    }
    .wrap {
      position: relative; width: min(1100px, 92vw); padding: clamp(20px, 4vw, 48px);
      display: flex; flex-direction: column; align-items: center; gap: 25px;
      isolation: isolate;
    }
    .topline {
      color: #ff2948; font-size: 11px; letter-spacing: .55em; font-weight: 800;
      text-transform: uppercase; animation: fadeIn 1.2s both;
    }
    .photo-frame {
      position: relative; width: min(390px, 76vw); aspect-ratio: 1 / 1;
      padding: 7px; border: 1px solid rgba(255, 35, 65, .8);
      background: linear-gradient(135deg, #ff1238, #260008 45%, #ff1238);
      box-shadow: 0 0 18px rgba(255, 0, 45, .35), 0 0 70px rgba(255, 0, 45, .17);
      animation: photoEnter 1.1s cubic-bezier(.2,.8,.2,1) both, glow 3s ease-in-out 1.1s infinite;
    }
    .photo-frame::before, .photo-frame::after {
      content: ""; position: absolute; width: 45px; height: 45px; z-index: 2;
      border-color: #ff2445; border-style: solid;
    }
    .photo-frame::before { top: -9px; left: -9px; border-width: 2px 0 0 2px; }
    .photo-frame::after { right: -9px; bottom: -9px; border-width: 0 2px 2px 0; }
    .photo {
      display: block; width: 100%; height: 100%; object-fit: cover;
      filter: grayscale(1) contrast(1.08); 
    }
    .title {
      margin: 0; text-align: center; font-size: clamp(42px, 9vw, 104px);
      line-height: .92; font-weight: 1000; letter-spacing: .045em;
      text-transform: uppercase; animation: titleEnter 1.1s .25s both;
      text-shadow: 0 0 10px rgba(255, 0, 45, .6), 0 0 35px rgba(255, 0, 45, .28);
    }
    .title span { color: #ff2445; }
    .subtitle {
      margin: 0; color: #c9c9c9; text-align: center;
      font-size: clamp(13px, 2vw, 18px); letter-spacing: .28em;
      font-weight: 700; animation: fadeIn 1.4s .65s both;
    }
    .line {
      width: min(360px, 60vw); height: 2px; background: linear-gradient(90deg, transparent, #ff2445, transparent);
      box-shadow: 0 0 14px #ff2445; animation: lineIn 1.4s .6s both;
    }
    .particles span {
      position: fixed; bottom: -15px; width: 3px; height: 3px; border-radius: 50%;
      background: #ff2445; box-shadow: 0 0 10px 2px #ff2445; opacity: 0;
      animation: rise 7s linear infinite;
    }
    .particles span:nth-child(1) { left: 12%; animation-delay: 0s; }
    .particles span:nth-child(2) { left: 28%; animation-delay: 2s; }
    .particles span:nth-child(3) { left: 51%; animation-delay: 4s; }
    .particles span:nth-child(4) { left: 73%; animation-delay: 1s; }
    .particles span:nth-child(5) { left: 89%; animation-delay: 3s; }
    @keyframes ambience { to { transform: translate3d(3%, -2%, 0) scale(1.08); } }
    @keyframes photoEnter { from { opacity: 0; transform: translateY(28px) scale(.94); } to { opacity: 1; transform: none; } }
    @keyframes titleEnter { from { opacity: 0; transform: translateY(22px); letter-spacing: .25em; } to { opacity: 1; transform: none; letter-spacing: .045em; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes lineIn { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes glow { 50% { box-shadow: 0 0 28px rgba(255,0,45,.65), 0 0 95px rgba(255,0,45,.25); } }
    @keyframes rise { 0% { transform: translateY(0) scale(.5); opacity: 0; } 15% { opacity: .8; } 100% { transform: translateY(-110vh) scale(1.4); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
